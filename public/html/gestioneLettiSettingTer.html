<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GESTIONE BED MANAGER</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="../stylesheets/style.css" rel="stylesheet">

  <!-- Script Logica Applicativa -->
  <script type="module" src="../javascripts/settingLogicaTerritorio.js" defer></script>

  <style>
    /* Lo scroll interno si attiva solo da desktop in su per non rompere la navigazione mobile */
    @media (min-width: 992px) {
      .col-scroll {
        height: calc(100vh - 125px); /* Header + Footer di ingombro */
        overflow-y: auto;
      }
    }

    /* Ottimizzazione visiva per i letti generati dinamicamente */
    .beds-row-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- NOTA: Corretto il link di Bootstrap all'URL ufficiale CDN per evitare errori di caricamento -->
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- HEADER RESPONSIVE -->
  <nav class="navbar navbar-dark bg-primary mb-3">
    <div class="container-fluid px-3">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <img src="../images/ATC_scritta.jpg" alt="Logo" width="40" height="50" class="img-fluid">
        <img src="../images/logo.jpg" alt="Logo" width="60" height="50" class="img-fluid">
      </a>
      <div class="d-flex align-items-center gap-3">
        <!-- Il testo di benvenuto si nasconde sui telefoni molto piccoli per non sovrapporsi -->
        <p class="text-white mb-0 d-none d-sm-block">Benvenuto, <span id="nomeUtente"></span></p>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- CONTENUTO PRINCIPALE RESPONSIVE -->
  <main class="container-fluid flex-grow-1 px-3">
    <!-- row g-3 gestisce lo spazio (gutter) tra le colonne sia in verticale che in orizzontale -->
    <div class="row g-3">

      <!-- COLONNA 1: Menu (Larghezza fissa su desktop, intera su mobile) -->
      <div class="col-12 col-lg-2 col-scroll p-3 border bg-light left-column rounded shadow-sm">
        <h4 class="h5 border-bottom pb-2">Menu Principale</h4>
        <div id="menuSx" class="nav flex-column"></div>
      </div>

      <!-- COLONNA 2: Dashboard e Tabelle (Occupa lo spazio centrale rimanente) -->
      <div class="col-12 col-lg-7 col-scroll p-3 border bg-light position-relative center-column rounded shadow-sm">
        <div class="container bg-secondary text-white p-2 mb-3 d-none rounded" id="secondMenu">
          <span class="fw-bold">Intestazione</span>
        </div>

        <!-- Dashboard -->
        <div class="row">
          <div id="dashboardReparti" class="dashboard col-12 mb-3"></div>  
        </div>
        
        <!-- Tabelle Dati (Ricordati di inserire la classe .table-responsive nel JS che genera le tabelle) -->
        <div id="tabellaTrasf" class="table-responsive mb-3"></div>
        <div id="tabellaDimissioni" class="table-responsive mb-3"></div>
        <div id="tabellaRicoverati" class="table-responsive mb-3"></div>
      </div>

      <!-- COLONNA 3: Pazienti e Letti (Colonna destra su desktop, in fondo su mobile) -->
      <div class="col-12 col-lg-3 col-scroll p-3 border bg-light right-column rounded shadow-sm">
        <h4 class="h5 border-bottom pb-2 mb-3">Stato Letti & Pazienti</h4>
        <h2 id="lettiLiberi" class="h6 badge bg-success d-block text-start p-2 mb-2"></h2>
        <h2 id="lettiChiusi" class="h6 badge bg-danger d-block text-start p-2 mb-2"></h2>
        <h2 id="pzTrasferiti" class="h6 badge bg-warning text-dark d-block text-start p-2 mb-3"></h2>
        
        <div id="tabellaRisultati" class="table-responsive mb-3"></div>
        
        <!-- Contenitore letti ottimizzato per la visualizzazione a griglia flessibile -->
        <div class="beds-row-container d-flex flex-wrap gap-1" id="contenitoreLettoDx">
          <!-- Generato dinamicamente da JS (da 1 a 54 volte) -->
        </div>
      </div>

    </div>
  </main>



  <!-- FOOTER -->
  <footer class="bg-dark text-white text-center mt-auto">
    <div class="container-fluid bg-info text-dark p-3 fw-bold">
      DIPARTIMENTO INFERMIERISTICO - GESTIONE POSTI LETTO
    </div>
  </footer>
  
  <!-- MODALE: Gestione Letto -->
  <div class="modal fade" id="modalLetto" tabindex="-1" aria-labelledby="modalLettoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLettoLabel">Gestione Posto Letto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formModale">
            <!-- JS genererà dinamicamente i campi -->
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODALE: Inserimento Paziente -->
  <div class="modal fade" id="insPaziente" tabindex="-1" aria-labelledby="modalInsPazienteLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalInsPazienteLabel">Inserimento Paziente da trasferire</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formInsPaziente">
            <!-- JS genererà dinamicamente i campi -->
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODALE: Alert Errore -->
  <div class="modal fade" id="alert" tabindex="-1" aria-labelledby="modalAlertLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-danger">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title" id="modalAlertLabel">ATTENZIONE: ATTIVITÀ NON CONSENTITA</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBodyAlert">
          <!-- Contenuto dinamico dell'errore -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle JS (Incluso prima della chiusura del body per performance) -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  </body>

</html>
