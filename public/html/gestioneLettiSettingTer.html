<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GESTIONE BED MANAGER</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="../stylesheets/style.css" rel="stylesheet">

  <!-- Script Logica Applicativa -->
  <script type="module" src="../javascripts/settingLogicaTerritorio.js" defer></script>

  <style>
    .grid-container {
      display: grid;
      grid-template-columns: 200px 1fr 200px;
     /* height: calc(100vh - 125px);  header + footer */
    }

    .col-scroll {
      overflow-y: auto;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">
<script src="https://stackpath.bootstrapcdn.com/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <!-- HEADER -->
  <nav class="navbar navbar-dark bg-primary mb-3">
    <div class="container">
      <a class="navbar-brand" href="#"><img src="../images/ATC_scritta.jpg" alt="Logo" width="40" height="50"><img src="../images/logo.jpg" alt="Logo" width="60" height="50"></a>
      <p class="text-white mb-0">Benvenuto, <span id="nomeUtente"></span></p>
      <button class="btn btn-outline-light" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <!-- CONTENUTO PRINCIPALE -->
    <!-- CONTENUTO PRINCIPALE -->
  <main class="container-fluid flex-grow-1 p-0">
    <div class="grid-container">

      <!-- COLONNA 1: Menu (Aggiunta classe left-column) -->
      <div class="col-scroll p-3 border bg-light left-column">
        <h4>Menu Principale</h4>
        <div id="menuSx"></div>
      </div>

      <!-- COLONNA 2: Dashboard e Tabelle -->
      <div class="col-scroll p-3 border bg-light position-relative center-column">
        <div class="container bg-secondary p-3 mb-3 d-none" id="secondMenu">
          <a class="navbar-brand" href="#">Intestazione</a>
        </div>

        <div class="d-flex flex-wrap gap-2">
          <div id="dashboardReparti" class="dashboard col-md-12"></div>  
        </div>
        <div id="tabellaTrasf"></div>
        <div id="tabellaDimissioni"></div>
      </div>

      <!-- COLONNA 3: Pazienti e Letti -->
      <div class="right-column p-3 border bg-light col-scroll">
        <h2 id="lettiLiberi" class="h6"></h2>
        <h2 id="lettiChiusi" class="h6"></h2>
        <h2 id="pzTrasferiti" class="h6"></h2>
        <div id="tabellaRisultati"></div>
        <!-- Contenitore a fila unica -->
        <div class="beds-row-container" id="contenitoreLettoDx">
          <!-- Generato dinamicamente da JS (da 1 a 54 volte) -->
        </div>
      </div>

    </div>
  </main>


  <!-- FOOTER -->
  <footer class="bg-dark text-white text-center mt-auto">
    <div class="container-fluid bg-info text-dark p-3 fw-bold">
      DIPARTIMENTO INFERMIERISTICO - GESTIONE POSTI LETTO
    </div>
  </footer>
  
  <!-- MODALE: Gestione Letto -->
  <div class="modal fade" id="modalLetto" tabindex="-1" aria-labelledby="modalLettoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLettoLabel">Gestione Posto Letto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formModale">
            <!-- JS genererà dinamicamente i campi -->
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODALE: Inserimento Paziente -->
  <div class="modal fade" id="insPaziente" tabindex="-1" aria-labelledby="modalInsPazienteLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalInsPazienteLabel">Inserimento Paziente da trasferire</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="formInsPaziente">
            <!-- JS genererà dinamicamente i campi -->
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODALE: Alert Errore -->
  <div class="modal fade" id="alert" tabindex="-1" aria-labelledby="modalAlertLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-danger">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title" id="modalAlertLabel">ATTENZIONE: ATTIVITÀ NON CONSENTITA</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBodyAlert">
          <!-- Contenuto dinamico dell'errore -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle JS (Incluso prima della chiusura del body per performance) -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  </body>

</html>
