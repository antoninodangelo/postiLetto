<!DOCTYPE html>
<html lang="it">

<head>

  <script src="../javascripts/indexLogica.js" defer></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colonne Scrollabili</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="../stylesheets/style.css" rel="stylesheet">



  <style>
    .grid-container {
      display: grid;
      grid-template-columns: 200px 1fr 200px;
      height: calc(100vh - 120px);
      /* header + footer */
    }

    .col-scroll {
      overflow-y: auto;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- HEADER -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Intestazione</a>
    </div>
  </nav>

  <!-- CONTENUTO -->
  <main class="container-fluid flex-grow-1">
    <div class="grid-container">

      <!-- COLONNA 1 -->
      <div class="col-scroll p-3 border bg-light">
        <h4>Menu Principale</h4>
        <p>VISULAIZZA STATISTICHE</p>
        <p>VAI A GESITONE ZONE</p>
        <p>VAI A GESTIONE UTENTI</p>
        <p>GESTIONE SETTING PER ZONA</p>
        <p>…</p>
        
      </div>

      <!-- COLONNA 2 -->

      <!-- COLONNA 2 -->
      <div class="col-scroll p-3 border bg-light position-relative">
        <button id="toggleMenu" class="btn btn-sm btn-primary position-absolute" style="top: 5px; left: 10px;">
          ☰ Menu
        </button>
        <div class="container bg-secondary p-3 mb-3 d-none" id="secondMenu">
          <a class="navbar-brand" href="#">ATC Dipartimento Assistenza infermieristica e ostetrico</a>
        </div>


        <div class="d-flex flex-wrap gap-2">
          <div id="dashboardReparti" class="dashboard"></div>

        </div>

      </div>
      <div class="right-column">
        <h3 id="titoloLettiReparto">Letti Reparto</h3>

        <!-- Contenitore a fila unica -->
        <div class="beds-row-container" id="contenitoreLettoDx">
          <!-- Ripetere questo div da 1 a 54 volte -->
          
        </div>
      </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-dark text-white text-center py-3 mt-auto">
    

    <div class="container-fluid bg-info p-3">
     DIAPARTIMENTO INFERMIERISTICO - GESTIONE POSTI LETTO
    </div>
  </footer>
  <script>
    document.getElementById("toggleMenu").addEventListener("click", function () {
      document.getElementById("secondMenu").classList.toggle("d-none");
    });
  </script>
  <!-- Modale Bootstrap -->
  <div class="modal fade" id="modalLetto" tabindex="-1" aria-labelledby="modalLettoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLettoLabel">Gestione Posto Letto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBodyContent">
          <form id="formModale">
            <!-- Qui JavaScript genererà dinamicamente i campi del form -->
          </form>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn class-secondario" data-bs-dismiss="modal">Annulla</button>
          <!-- <button type="button" class="btn btn-primary" id="btnConfermaAzione">Conferma Modifica</button> -->
        </div>
      </div>
    </div>
  </div>

   <div class="modal fade" id="modalLettoDx" tabindex="-1" aria-labelledby="modalLettoLabelDx" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalLettoLabelDx">Gestione Posto Letto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBodyContent">
          <form id="formModaleDx">
            <!-- Qui JavaScript genererà dinamicamente i campi del form -->
          </form>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn class-secondario" data-bs-dismiss="modal">Annulla</button>
          <!-- <button type="button" class="btn btn-primary" id="btnConfermaAzione">Conferma Modifica</button> -->
        </div>
      </div>
    </div>
  </div>

</body>

</html>
